name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Frontend lint + format (Biome)
        run: npm run check

      - name: Frontend tests (Vitest)
        run: npm test

      - name: Frontend build (typecheck + Vite)
        run: npm run build

      - name: Rust format
        run: cargo fmt --check
        working-directory: ./src-tauri

  build:
    needs: checks
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Rust format
        if: matrix.platform == 'macos-latest'
        run: cargo fmt --check
        working-directory: ./src-tauri

      - name: Rust lint (clippy)
        if: matrix.platform == 'macos-latest'
        run: cargo clippy --all-targets -- -D warnings
        working-directory: ./src-tauri

      - name: Rust tests
        if: matrix.platform == 'macos-latest'
        run: cargo test
        working-directory: ./src-tauri

      - name: Build (sin publicar)
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FACTURITA_CLIENT_ID: ${{ secrets.FACTURITA_CLIENT_ID }}
          FACTURITA_CLIENT_SECRET: ${{ secrets.FACTURITA_CLIENT_SECRET }}

      - name: Build y publicar release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FACTURITA_CLIENT_ID: ${{ secrets.FACTURITA_CLIENT_ID }}
          FACTURITA_CLIENT_SECRET: ${{ secrets.FACTURITA_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Facturita ${{ github.ref_name }}"
          releaseBody: "Instaladores para Windows (NSIS) y macOS (DMG)."
          releaseDraft: false
          prerelease: false

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: facturita-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: ignore
